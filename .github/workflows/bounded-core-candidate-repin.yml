name: bounded-core-candidate-repin

on:
  push:
    branches: [assembly-own-key-world-closure]

permissions:
  contents: write

jobs:
  repin:
    if: ${{ !contains(github.event.head_commit.message, '[own-key-core-repin]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assembly-own-key-world-closure
      - name: Bind own-key proof to exact core candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          old_core = '429a344f7d9333bef01cf9de1c292c3af09abec2'
          merged_core = '63a65c70bb702cb9ac979ec04233ffaa7ed5d179'
          candidate_core = '43a9eccf831a49aedc169a5ce0b6701e22ae4cc3'

          for path in [
            Path('test/capability-grant-proof.integration.test.js'),
            Path('test/interface-proof-kit.integration.test.js'),
            Path('test/nested-interface-target.integration.test.js')
          ]:
            text = path.read_text()
            count = text.count(old_core)
            if count not in (0, 1):
              raise SystemExit(f'{path}: expected at most 1 old-core ref, found {count}')
            path.write_text(text.replace(old_core, candidate_core))

          path = Path('test/named-own-key-closure.test.js')
          text = path.read_text()
          count = text.count(merged_core)
          if count not in (0, 1):
            raise SystemExit(f'{path}: expected at most 1 merged-core ref, found {count}')
          path.write_text(text.replace(merged_core, candidate_core))

          path = Path('.github/workflows/test.yml')
          text = path.read_text()
          count = text.count(merged_core)
          if count not in (0, 2):
            raise SystemExit(f'{path}: expected 0 or 2 merged-core refs, found {count}')
          path.write_text(text.replace(merged_core, candidate_core))

          path = Path('machine.json')
          text = path.read_text()
          count = text.count(merged_core)
          if count not in (0, 1):
            raise SystemExit(f'{path}: expected at most 1 merged-core ref, found {count}')
          path.write_text(text.replace(merged_core, candidate_core))
          PY
      - name: Commit exact candidate dependency
        run: |
          git config user.name "mike-axiom-mir"
          git config user.email "miketobi90@gmail.com"
          git add .github/workflows/test.yml machine.json test/capability-grant-proof.integration.test.js test/interface-proof-kit.integration.test.js test/nested-interface-target.integration.test.js test/named-own-key-closure.test.js
          git diff --cached --exit-code && exit 1 || true
          git commit -m "test: bind own-key closure to exact core candidate [own-key-core-repin]"
          git push origin HEAD:assembly-own-key-world-closure
