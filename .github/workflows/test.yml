name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-form
          ref: bd67179e2aebd20708b02152d07752b37df16e66
          path: .siblings/form
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-surface
          ref: 67599d08938c8aac236dfa1421c25856f4b962ba
          path: .siblings/surface
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-capability
          ref: edc07af182ee26ca1ceb64b5d5205591ec6aca9d
          path: .siblings/capability
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-interface
          ref: 271fbf2abe6fc214d30076b9417655f084221eac
          path: .siblings/interface
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-form
          ref: 33625a6e98cdeb985635e0cdcfd5c754ad8505fe
          path: .siblings/round8/form
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-surface
          ref: 536a745ddea4d996d0daf193649db939fe3ade83
          path: .siblings/round8/surface
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-interface
          ref: 3f29f98b4125fe3376f02aabc509dc3da610deae
          path: .siblings/round8/interface
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-form
          ref: 378e7896acfdf8d4bd28d08127c1f57546e3eef1
          path: .siblings/round10/form
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-surface
          ref: 4349ba0d926aee1d36dde86fc7f69d04a58bf924
          path: .siblings/round10/surface
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-interface
          ref: 1a941f8ff88ca590952571e3eeeeeeef6daefd77
          path: .siblings/round10/interface
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-form
          ref: dd6975f29390e3175642a7d510b3c5320415b620
          path: .siblings/round19/form
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-surface
          ref: 4e4495182aa83e5dfba37722fc3756a70cfaafaa
          path: .siblings/round19/surface
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-interface
          ref: 8516da3a414c416ec1f76b1078901c56c49b04db
          path: .siblings/round19/interface
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile
          ref: 2bdf8eade1376055473b9cc1b11734b72a5566e5
          path: .runtime/morphtile
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
        env:
          FORM_MACHINE_PATH: ${{ github.workspace }}/.siblings/form/src
          FORM_COMMIT: bd67179e2aebd20708b02152d07752b37df16e66
          SURFACE_MACHINE_PATH: ${{ github.workspace }}/.siblings/surface/src
          CAPABILITY_MACHINE_PATH: ${{ github.workspace }}/.siblings/capability/src
          INTERFACE_MACHINE_PATH: ${{ github.workspace }}/.siblings/interface/src
          INTERFACE_V05_MACHINE_PATH: ${{ github.workspace }}/.siblings/interface/src
          INTERFACE_NESTED_MACHINE_PATH: ${{ github.workspace }}/.siblings/interface/src
          INTERFACE_PROOF_MACHINE_PATH: ${{ github.workspace }}/.siblings/interface/src
          MORPHTILE_CORE_PATH: ${{ github.workspace }}/.runtime/morphtile/core/morphtile.js
          MORPHTILE_COMMIT: 2bdf8eade1376055473b9cc1b11734b72a5566e5
          INTERFACE_V05_COMMIT: 271fbf2abe6fc214d30076b9417655f084221eac
          INTERFACE_NESTED_COMMIT: 271fbf2abe6fc214d30076b9417655f084221eac
          INTERFACE_PROOF_COMMIT: 271fbf2abe6fc214d30076b9417655f084221eac
          ROUND8_FORM_MACHINE_PATH: ${{ github.workspace }}/.siblings/round8/form/src
          ROUND8_FORM_COMMIT: 33625a6e98cdeb985635e0cdcfd5c754ad8505fe
          ROUND8_SURFACE_MACHINE_PATH: ${{ github.workspace }}/.siblings/round8/surface/src
          ROUND8_SURFACE_COMMIT: 536a745ddea4d996d0daf193649db939fe3ade83
          ROUND8_CAPABILITY_MACHINE_PATH: ${{ github.workspace }}/.siblings/capability/src
          ROUND8_CAPABILITY_COMMIT: edc07af182ee26ca1ceb64b5d5205591ec6aca9d
          ROUND8_INTERFACE_MACHINE_PATH: ${{ github.workspace }}/.siblings/round8/interface/src
          ROUND8_INTERFACE_COMMIT: 3f29f98b4125fe3376f02aabc509dc3da610deae
          ROUND8_MORPHTILE_CORE_PATH: ${{ github.workspace }}/.runtime/morphtile/core/morphtile.js
          ROUND8_MORPHTILE_COMMIT: 2bdf8eade1376055473b9cc1b11734b72a5566e5
          ROUND10_FORM_MACHINE_PATH: ${{ github.workspace }}/.siblings/round10/form/src
          ROUND10_FORM_COMMIT: 378e7896acfdf8d4bd28d08127c1f57546e3eef1
          ROUND10_SURFACE_MACHINE_PATH: ${{ github.workspace }}/.siblings/round10/surface/src
          ROUND10_SURFACE_COMMIT: 4349ba0d926aee1d36dde86fc7f69d04a58bf924
          ROUND10_CAPABILITY_MACHINE_PATH: ${{ github.workspace }}/.siblings/capability/src
          ROUND10_CAPABILITY_COMMIT: edc07af182ee26ca1ceb64b5d5205591ec6aca9d
          ROUND10_INTERFACE_MACHINE_PATH: ${{ github.workspace }}/.siblings/round10/interface/src
          ROUND10_INTERFACE_COMMIT: 1a941f8ff88ca590952571e3eeeeeeef6daefd77
          ROUND10_MORPHTILE_CORE_PATH: ${{ github.workspace }}/.runtime/morphtile/core/morphtile.js
          ROUND10_MORPHTILE_COMMIT: 2bdf8eade1376055473b9cc1b11734b72a5566e5
          ROUND19_FORM_MACHINE_PATH: ${{ github.workspace }}/.siblings/round19/form/src
          ROUND19_FORM_COMMIT: dd6975f29390e3175642a7d510b3c5320415b620
          ROUND19_SURFACE_MACHINE_PATH: ${{ github.workspace }}/.siblings/round19/surface/src
          ROUND19_SURFACE_COMMIT: 4e4495182aa83e5dfba37722fc3756a70cfaafaa
          ROUND19_CAPABILITY_MACHINE_PATH: ${{ github.workspace }}/.siblings/capability/src
          ROUND19_CAPABILITY_COMMIT: edc07af182ee26ca1ceb64b5d5205591ec6aca9d
          ROUND19_INTERFACE_MACHINE_PATH: ${{ github.workspace }}/.siblings/round19/interface/src
          ROUND19_INTERFACE_COMMIT: 8516da3a414c416ec1f76b1078901c56c49b04db
          ROUND19_MORPHTILE_CORE_PATH: ${{ github.workspace }}/.runtime/morphtile/core/morphtile.js
          ROUND19_MORPHTILE_COMMIT: 2bdf8eade1376055473b9cc1b11734b72a5566e5
