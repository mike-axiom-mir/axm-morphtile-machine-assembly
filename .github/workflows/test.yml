name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-form
          ref: bd67179e2aebd20708b02152d07752b37df16e66
          path: .siblings/form
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-surface
          ref: 67599d08938c8aac236dfa1421c25856f4b962ba
          path: .siblings/surface
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-capability
          ref: edc07af182ee26ca1ceb64b5d5205591ec6aca9d
          path: .siblings/capability
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-interface
          ref: 271fbf2abe6fc214d30076b9417655f084221eac
          path: .siblings/interface
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile
          ref: 2bdf8eade1376055473b9cc1b11734b72a5566e5
          path: .runtime/morphtile
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
        env:
          FORM_MACHINE_PATH: ${{ github.workspace }}/.siblings/form/src
          FORM_COMMIT: bd67179e2aebd20708b02152d07752b37df16e66
          SURFACE_MACHINE_PATH: ${{ github.workspace }}/.siblings/surface/src
          CAPABILITY_MACHINE_PATH: ${{ github.workspace }}/.siblings/capability/src
          INTERFACE_MACHINE_PATH: ${{ github.workspace }}/.siblings/interface/src
          INTERFACE_V05_MACHINE_PATH: ${{ github.workspace }}/.siblings/interface/src
          INTERFACE_NESTED_MACHINE_PATH: ${{ github.workspace }}/.siblings/interface/src
          INTERFACE_PROOF_MACHINE_PATH: ${{ github.workspace }}/.siblings/interface/src
          MORPHTILE_CORE_PATH: ${{ github.workspace }}/.runtime/morphtile/core/morphtile.js
          MORPHTILE_COMMIT: 2bdf8eade1376055473b9cc1b11734b72a5566e5
          INTERFACE_V05_COMMIT: 271fbf2abe6fc214d30076b9417655f084221eac
          INTERFACE_NESTED_COMMIT: 271fbf2abe6fc214d30076b9417655f084221eac
          INTERFACE_PROOF_COMMIT: 271fbf2abe6fc214d30076b9417655f084221eac
